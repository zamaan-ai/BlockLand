services:
  postgres:
    image: postgres:16-alpine
    container_name: blockland-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: blockland
      POSTGRES_PASSWORD: blockland
      POSTGRES_DB: blockland
    volumes:
      - blockland_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockland -d blockland"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: blockland-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - blockland_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  blockland_pg:
  blockland_redis:
